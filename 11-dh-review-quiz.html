['1. 【原书 P53 例 3.6】空间 RPR 臂 DH 表转矩阵','已知原书图 3-11 的三自由度 RPR 机械臂 DH 表第 2 行（移动关节）为：'+K('\\alpha_1=90^\\circ,\\;a_1=0,\\;d_2=L_2,\\;\\theta_2=90^\\circ')+'。请代入 §3.5 公式 (3.6) 写出局部变换矩阵 '+K('{}^1_2T')+'。',B('{}^1_2T=\\begin{bmatrix}0&-1&0&0\\\\0&0&-1&-L_2\\\\1&0&0&0\\\\0&0&0&1\\end{bmatrix}'),'<p><strong>第 1 步：先求两个角度的余弦和正弦（遇到 90° 大量项变为 0 或 1）。</strong></p>'+B('\\alpha_1=90^\\circ\\implies\\cos\\alpha_1=0,\\;\\sin\\alpha_1=1;\\qquad\\theta_2=90^\\circ\\implies\\cos\\theta_2=0,\\;\\sin\\theta_2=1')+'<p><strong>第 2 步：代入 §3.5 式 (3.6) 通用模板（或直接用前两步乘后两步）：</strong></p>'+B('{}^{i-1}_iT=\\begin{bmatrix}c\\theta_i&-s\\theta_i&0&a_{i-1}\\\\s\\theta_i c\\alpha_{i-1}&c\\theta_i c\\alpha_{i-1}&-s\\alpha_{i-1}&-s\\alpha_{i-1}d_i\\\\s\\theta_i s\\alpha_{i-1}&c\\theta_i s\\alpha_{i-1}&c\\alpha_{i-1}&c\\alpha_{i-1}d_i\\\\0&0&0&1\\end{bmatrix}')+'<p><strong>第 3 步：逐行填入 0 和 1：</strong></p><ul><li>第 1 行：'+K('[0,\\;-1,\\;0,\\;0]')+'</li><li>第 2 行：'+K('[1\\times 0,\\;0\\times 0,\\;-1,\\;-1\\times L_2]=[0,\\;0,\\;-1,\\;-L_2]')+'</li><li>第 3 行：'+K('[1\\times 1,\\;0\\times 1,\\;0,\\;0\\times L_2]=[1,\\;0,\\;0,\\;0]')+'</li></ul><p>核对原书第 53 页式 (3.7) 中间的 '+K('{}^1_2T')+'，一字不差！</p>'],
['2. 【真实工业臂·原书 P56 PUMA 560】肩部扭转行转矩阵','在六轴工业机械臂 PUMA 560 的 DH 表（原书 P56 图 3-21）中，第 2 行参数为 '+K('\\alpha_1=-90^\\circ,\\;a_1=0,\\;d_2=0,\\;\\theta_2=\\theta_2')+'。请将其转成单节齐次变换矩阵 '+K('{}^1_2T')+'。',B('{}^1_2T=\\begin{bmatrix}c\\theta_2&-s\\theta_2&0&0\\\\0&0&1&0\\\\-s\\theta_2&-c\\theta_2&0&0\\\\0&0&0&1\\end{bmatrix}'),'<p><strong>第 1 步：先化简固定扭角 '+K('\\alpha_1=-90^\\circ')+' 的三角函数：</strong></p>'+B('\\cos(-90^\\circ)=0,\\qquad\\sin(-90^\\circ)=-1')+'<p><strong>第 2 步：代入式 (3.6) 通用矩阵：</strong></p><ul><li>因为 '+K('\\cos\\alpha_1=0')+'，矩阵第 2 行前两项 '+K('s\\theta_2 c\\alpha_1,\\;c\\theta_2 c\\alpha_1')+' 直接归零！第 3 项 '+K('-\\sin(-90^\\circ)=+1')+'。</li><li>因为 '+K('\\sin\\alpha_1=-1')+'，矩阵第 3 行前两项变成 '+K('-s\\theta_2,\\;-c\\theta_2')+'，第 3 项 '+K('\\cos(-90^\\circ)=0')+'。</li><li>因为 '+K('a_1=0,\\;d_2=0')+'，第 4 列平移部分全为 '+K('0')+'（说明坐标系 '+K('\\{1\\}')+' 与 '+K('\\{2\\}')+' 原点重合）。</li></ul><p>这就是原书 P56 最底下一行的 '+K('{}^1_2T')+'！</p>'],
['3. 【真实工业臂·原书 P57 PUMA 560】带连杆长与偏距的行转矩阵','PUMA 560 的第 4 行（肘部 '+K('\\{3\\}')+' 到腕部 '+K('\\{4\\}')+'，见原书 P56 图 3-21）参数为：'+K('\\alpha_3=-90^\\circ,\\;a_3=a_3,\\;d_4=d_4,\\;\\theta_4=\\theta_4')+'。写出 '+K('{}^3_4T')+'，并指出当 '+K('a_3=0.02\\text{ m},\\;d_4=0.43\\text{ m}')+' 时腕部原点在 '+K('\\{3\\}')+' 系下的坐标。',B('{}^3_4T=\\begin{bmatrix}c\\theta_4&-s\\theta_4&0&a_3\\\\0&0&1&d_4\\\\-s\\theta_4&-c\\theta_4&0&0\\\\0&0&0&1\\end{bmatrix},\\quad {}^3P_{4ORG}=\\begin{bmatrix}0.02\\\\0.43\\\\0\\end{bmatrix}'),'<p><strong>第 1 步：对比上一题，同样是 '+K('\\alpha=-90^\\circ')+'，所以左上方 '+K('3\\times 3')+' 旋转块结构与 '+K('{}^1_2T')+' 完全一样！</strong></p><p><strong>第 2 步：专门看第 4 列位置项 '+K('[a_3,\\;-d_4\\sin(-90^\\circ),\\;d_4\\cos(-90^\\circ)]^T')+'：</strong></p>'+B('{}^3P_{4ORG}=\\begin{bmatrix}a_3\\\\-(-1)d_4\\\\0\\cdot d_4\\end{bmatrix}=\\begin{bmatrix}a_3\\\\d_4\\\\0\\end{bmatrix}=\\begin{bmatrix}0.02\\\\0.43\\\\0\\end{bmatrix}\\text{ m}')+'<p>你会发现：哪怕关节 4 随便转（'+K('\\theta_4')+' 任意变化），腕部中心在肘部系 '+K('\\{3\\}')+' 下的位置永远固定在 '+K('[0.02, 0.43, 0]^T')+'，这就是式 (3.6) 第 4 列不含 '+K('\\theta_i')+' 的威力！</p>'],
['4. 【真实协作臂·ROS 2 Franka Panda】从单节矩阵反读 DH 参数','已知某七轴协作机械臂相邻两连杆的 Craig 修正 DH 变换矩阵在 '+K('\\theta_i=0^\\circ')+' 时测得为：'+B('{}^{i-1}_iT(\\theta_i=0^\\circ)=\\begin{bmatrix}1&0&0&0.0825\\\\0&0&-1&-0.384\\\\0&1&0&0\\\\0&0&0&1\\end{bmatrix}')+'请直接从矩阵中反读出该行 DH 参数 '+K('(\\alpha_{i-1},\\;a_{i-1},\\;d_i)')+' 的数值。',''+K('\\alpha_{i-1}=+90^\\circ,\\;a_{i-1}=0.0825\\text{ m},\\;d_i=0.384\\text{ m}'),'<p><strong>第 1 步：看第 3 列 '+K('[0,\\;-\\sin\\alpha_{i-1},\\;\\cos\\alpha_{i-1}]^T=[0,-1,0]^T')+'：</strong></p><p>立得 '+K('\\sin\\alpha_{i-1}=1,\\;\\cos\\alpha_{i-1}=0\\implies\\alpha_{i-1}=+90^\\circ')+'。</p><p><strong>第 2 步：看第 4 列第 1 项 '+K('a_{i-1}')+'：</strong></p><p>直接读出 '+K('a_{i-1}=0.0825\\text{ m}')+'。</p><p><strong>第 3 步：看第 4 列第 2 项 '+K('-d_i\\sin\\alpha_{i-1}=-0.384')+'：</strong></p><p>因为 '+K('\\sin 90^\\circ=1')+'，所以 '+K('-d_i=-0.384\\implies d_i=0.384\\text{ m}')+'。</p>'],
['5. 【原书 P57 式 3.12】PUMA 560 平行轴两节矩阵连乘化简','在 PUMA 560 中，大臂关节 2 与小臂关节 3 的轴线平行（'+K('\\alpha_2=0')+'）。已知 '+B('{}^1_2T=\\begin{bmatrix}c_2&-s_2&0&0\\\\0&0&1&0\\\\-s_2&-c_2&0&0\\\\0&0&0&1\\end{bmatrix},\\quad {}^2_3T=\\begin{bmatrix}c_3&-s_3&0&a_2\\\\s_3&c_3&0&0\\\\0&0&1&d_3\\\\0&0&0&1\\end{bmatrix}')+'求连乘矩阵 '+K('{}^1_3T={}^1_2T\\,{}^2_3T')+' 的第 4 列位置向量 '+K('{}^1P_{3ORG}')+'。',B('{}^1P_{3ORG}=\\begin{bmatrix}a_2 c_2\\\\d_3\\\\-a_2 s_2\\end{bmatrix}'),'<p><strong>第 1 步：利用分块乘法，只算左矩阵乘以右矩阵的第 4 列 '+K('[a_2,\\;0,\\;d_3,\\;1]^T')+'：</strong></p>'+B('\\begin{bmatrix}c_2&-s_2&0&0\\\\0&0&1&0\\\\-s_2&-c_2&0&0\\\\0&0&0&1\\end{bmatrix}\\begin{bmatrix}a_2\\\\0\\\\d_3\\\\1\\end{bmatrix}=\\begin{bmatrix}a_2 c_2\\\\d_3\\\\-a_2 s_2\\\\1\\end{bmatrix}')+'<p>这就是原书 P57 式 (3.12) 的第 4 列！物理意义一目了然：在 '+K('\\{1\\}')+' 系看来，小臂原点在水平面投影距离为 '+K('a_2\\cos\\theta_2')+'，竖直高度为 '+K('-a_2\\sin\\theta_2')+'，同时沿肩部侧向偏出 '+K('d_3')+'。</p>']
];
function D(a,e){return '<details><summary>显示答案与讲解</summary><div class="answer"><strong>答案：</strong>'+a+'<div class="explain">'+e+'</div></div></details>'}
function block(title,n,arr,type){let s='<h2>'+title+' <span class="tag">'+n+'</span></h2>';arr.forEach(function(x,i){let b='<section class="q"><h3>'+((type==='w')?x[0]:(i+1)+'. '+x[0])+'</h3>';if(type==='m'){x[1].split('|').forEach(function(v,j){b+='<label class="choice"><input type="radio" name="m'+i+'"> '+String.fromCharCode(65+j)+'. '+v+'</label>'});b+=D(x[2],x[3])}else if(type==='f'){b+='<input type="text" placeholder="在此作答">'+D(x[1],x[2])}else if(type==='j'){b+='<label class="choice"><input type="radio" name="j'+i+'"> 对</label><label class="choice"><input type="radio" name="j'+i+'"> 错</label>'+D(x[1],x[2])}else{b+='<p>'+x[1]+'</p><textarea placeholder="在这里记录过程，或在 iPad 上手算"></textarea>'+D(x[2],x[3])}s+=b+'</section>'});return s}
const root=document.getElementById('root');root.innerHTML=block('一、选择题','10 题',M,'m')+block('二、填空题','10 题',F,'f')+block('三、判断题','10 题',J,'j')+block('四、真实机械臂手算题（DH 表 ⇄ 矩阵）','5 题',W,'w');
addEventListener('load',function(){let n=0;function go(){if(window.katex){root.querySelectorAll('[data-tex]').forEach(function(e){katex.render(e.dataset.tex,e,{displayMode:e.classList.contains('math'),throwOnError:false})})}else if(n++<40)setTimeout(go,100)}go()});
