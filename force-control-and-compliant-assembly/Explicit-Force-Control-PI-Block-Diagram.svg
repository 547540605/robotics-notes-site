<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" role="img" aria-labelledby="title desc">
  <title id="title">NISTIR 7901 Figure 2：含完整反馈回路的 PI 显式力控制框图（重绘）</title>
  <desc id="desc">F S 进入左侧求和点正端，输出 F C 回到负端；误差分成比例和积分两支路，相加生成 F C。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#263746"/></marker>
    <style>text{font-family:Georgia,"Times New Roman",serif;fill:#172b3a}.signal{fill:none;stroke:#263746;stroke-width:2.6;stroke-linejoin:round}.label{font-size:26px}.small{font-size:21px}</style>
  </defs>
  <rect width="1150" height="360" fill="#fff"/>
  <text x="36" y="181" class="label">F<tspan baseline-shift="sub" font-size="16">S</tspan></text>
  <path class="signal" d="M87 170 H142" marker-end="url(#arrow)"/>
  <circle cx="170" cy="170" r="26" fill="#fff" stroke="#263746" stroke-width="2.6"/>
  <text x="147" y="159" class="small">+</text><text x="162" y="195" class="small">−</text>
  <path class="signal" d="M196 170 H315"/>
  <text x="247" y="150" class="small">error</text>
  <circle cx="315" cy="170" r="4" fill="#263746"/>
  <path class="signal" d="M315 170 V95 H386" marker-end="url(#arrow)"/>
  <path class="signal" d="M315 170 V245 H386" marker-end="url(#arrow)"/>
  <rect x="390" y="59" width="248" height="72" fill="#fff" stroke="#263746" stroke-width="2.6"/>
  <text x="514" y="105" text-anchor="middle" class="label">K<tspan baseline-shift="sub" font-size="16">P</tspan> e(t)</text>
  <rect x="390" y="209" width="248" height="72" fill="#fff" stroke="#263746" stroke-width="2.6"/>
  <text x="433" y="255" class="label">K<tspan baseline-shift="sub" font-size="16">I</tspan></text>
  <text x="481" y="260" font-size="38">∫</text><text x="501" y="228" font-size="15">t</text><text x="501" y="276" font-size="15">0</text>
  <text x="523" y="255" class="label">e(t) dt</text>
  <path class="signal" d="M638 95 H830 V142" marker-end="url(#arrow)"/>
  <path class="signal" d="M638 245 H830 V198" marker-end="url(#arrow)"/>
  <text x="705" y="81" class="small">P</text><text x="705" y="232" class="small">I</text>
  <circle cx="830" cy="170" r="26" fill="#fff" stroke="#263746" stroke-width="2.6"/>
  <text x="810" y="159" class="small">+</text><text x="810" y="194" class="small">+</text>
  <path class="signal" d="M856 170 H1031" marker-end="url(#arrow)"/>
  <circle cx="942" cy="170" r="4" fill="#263746"/>
  <text x="1045" y="181" class="label">F<tspan baseline-shift="sub" font-size="16">C</tspan></text>
  <path class="signal" d="M942 174 V322 H170 V197" marker-end="url(#arrow)"/>
</svg>
