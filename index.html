      function itemFor(file) { return entries.find(item => item.file === file) || entries.find(item => item.file.split('#')[0] === file.split('#')[0]) || entries[0]; }
      function requestedFile() { const match = location.hash.match(/^#note=(.+)$/); return match ? decodeURIComponent(match[1]) : '00-progress.html'; }
      function renderNav() {
        nav.innerHTML = chapters.map((chapter, index) => `<details data-chapter="${chapter.name}" ${index === 0 ? 'open' : ''}><summary>${chapter.name}</summary>${chapter.status ? `<div class="nav-status">${chapter.status}</div>` : ''}${chapter.items.map(([number, label, file]) => `<a class="nav-link" href="#note=${encodeURIComponent(file)}" data-file="${file}"><span class="number">${number}</span>${label}</a>`).join('')}</details>`).join('');
      }

      function updateActive() {
        const file = requestedFile();
        const item = itemFor(file);
        document.querySelectorAll('.nav-link').forEach(link => {
          const isActive = link.dataset.file === item.file;
          link.classList.toggle('active', isActive);
          if (isActive) {
            const parentDetails = link.closest('details');
            if (parentDetails) parentDetails.open = true;
          }
        });
        if (reader.getAttribute('src') !== file) reader.src = file;
        title.textContent = `${item.number} ${item.title}`;
        openPage.href = file;
        document.title = `${item.title} · 机器人学入门笔记`;
        document.body.classList.remove('menu-open');
        if (menu) menu.setAttribute('aria-expanded', 'false');
      }

      function syncReaderHash() {
        try {
          const frameLocation = reader.contentWindow.location;
          if (frameLocation.origin !== location.origin) return;
          const basePath = new URL('.', location.href).pathname;
          if (!frameLocation.pathname.startsWith(basePath)) return;
          const currentFrameFile = decodeURIComponent(frameLocation.pathname.slice(basePath.length));
          const currentFrameTarget = currentFrameFile + frameLocation.hash;
          if (currentFrameFile && currentFrameTarget !== requestedFile()) {
            location.hash = `#note=${encodeURIComponent(currentFrameTarget)}`;
          }
        } catch (_) {}
      }

      if (menu) {
        menu.addEventListener('click', () => {
          const isOpen = document.body.classList.toggle('menu-open');
          menu.setAttribute('aria-expanded', String(isOpen));
        });
      }

      renderNav();
      updateActive();
      window.addEventListener('hashchange', updateActive);
      reader.addEventListener('load', syncReaderHash);
    })();
  </script>
</body>
</html>
